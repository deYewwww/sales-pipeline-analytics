# Profile for dbt run inside Airflow. Secrets come from env vars (set in orchestration/.env)
# Safe to commit: contain no secrets.

sales_pipeline_analytics:
  target: airflow 
  outputs: 
    airflow:
      type: databricks 
      database: sales_pipeline_analytics
      schema: gold
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      auth_type: token
      threads: 1 
      